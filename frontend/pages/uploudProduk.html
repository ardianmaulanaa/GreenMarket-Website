<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- FONT -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- BOOTSTRAP -->
    <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/uploudProduk.css" />
    <title>uploud produk</title>
  </head>



  <body>

  <!--NAVBAR-->
  <nav class="navbar navbar-expand-lg bg-dark-custom py-2 navbar-dark">
    <div class="container"> <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
        <div class="logo-circle me-2"></div>
        GreenMarket
      </a>

  <!--SEARCH BAR-->
      <div class="mx-auto" style="width: 100%; max-width: 600px;">
        <div class="input-group search-container">
          <span class="input-group-text border-end-0 bg-white">
            <i class="bi bi-search text-muted"></i>
          </span>
          <input type="text" class="form-control border-start-0 ps-0" placeholder="Pencarian">
        </div>
      </div>

  <!--ICON--> 
      <div class="d-flex align-items-center gap-3">
        <a href="#" class="text-white-50"><i class="bi bi-basket fs-5"></i></a>
        <a href="#" class="text-warning"><i class="bi bi-bell fs-5"></i></a>
        <a href="#" class="text-success"><i class="bi bi-chat-dots fs-5"></i></a>

  <!--PROFIL-->
       <div class="profile-frame ms-2">
          <img src="https://via.placeholder.com/35" alt="User">
        </div>
      </div>

    </div>
  </nav>

 <!--CARD-->
  <main class="container-main">
    <div class="card card-border">
      
      <div class="card-header">
        Upload produk jualan mu
        <p class="header-subtitle">Mulai jual produk Anda dan raih keuntungan maksimal</p>
      </div>

      <div class="card-body">
        <div class="label-container">
          <span class="label-text">Foto Produk</span> <span class="label-count">(0/5)</span>
        </div>

        <div class="upload-area" id="drop-area">
          <div id="preview-container" class="preview-container"></div>
          <div id="upload-instructions" class="upload-instructions">
            <div class="icon-plus">
              <i class="bi bi-plus-lg"></i>
            </div>
            <p class="instruction-title">Drag & drop gambar di sini</p>
            <p class="instruction-subtitle">atau klik memilih file</p>
            <p class="instruction-format">
              PNG, JPG hingga 10MB
            </p>
          </div>
          <input type="file" class="file-input" id="fileInput" multiple accept="image/*">
        </div>

        <div class="tips-box">
          <p class="tips-text">
            Tips: Foto pertama akan menjadi foto utama produk. Gunakan foto dengan kualitas terbaik!
          </p>
        </div>

        <button class="btn-kirim">Kirim</button>
      </div>
      
    </div>
  </main>

  </body>

</html>
