<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Produk - GreenMarket</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <link rel="stylesheet" href="../css/manajemenProduk.css">

</head>
<body>

    <nav id="navbar" class="navbar navbar-expand-lg fixed-top px-4">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">GreenMarket</a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <i class="bi bi-search" style="font-size: 20px; cursor: pointer;"></i>
                <i class="bi bi-bell" style="font-size: 20px; cursor: pointer;"></i>
                <i class="bi bi-person-circle" style="font-size: 24px; cursor: pointer;"></i>
            </div>
        </div>
    </nav>

    <div class="container-main">
        <div class="card-border">
            <div class="card-header-custom">
                <h2>Upload produk jualan mu</h2>
                <p class="header-subtitle">Mulai jual produk Anda dan raih keuntungan maksimal</p>
            </div>

            <div class="card-body-custom">
                <div class="label-container">
                    <span class="label-text">Foto Produk</span>
                    <span class="label-count">(0/5)</span>
                </div>

                <div class="upload-area" onclick="document.getElementById('fileInput').click();">
                    <div class="icon-plus">
                        <i class="bi bi-plus-lg" style="font-size: 24px;"></i>
                    </div>
                    <p class="instruction-title">Drag & drop gambar di sini</p>
                    <p class="instruction-subtitle">atau klik memilih file</p>
                    <p class="instruction-format">PNG, JPG hingga 10MB</p>
                    <input type="file" id="fileInput" multiple accept="image/*">
                </div>

                <div class="tips-box">
                    <p class="tips-text">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        Tips: Foto pertama akan menjadi foto utama produk. Gunakan foto dengan kualitas terbaik!
                    </p>
                </div>

                <button type="button" class="btn-kirim">Kirim</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
