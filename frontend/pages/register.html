<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar - GreenMarket</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.css" />

    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f1f8e9; /* Tema Hijau Muda */
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        overflow: hidden;
      }

      /* Tombol Kembali (Back) */
      .btn-back {
        position: absolute;
        top: 30px;
        left: 30px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #6b7c71;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.3s ease;
        padding: 8px 16px;
        border-radius: 50px;
        background: white;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      }

      .btn-back:hover {
        color: #2fa84f;
        transform: translateX(-5px);
        box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      }

      /* Card Register */
      .register-card {
        background: white;
        padding: 40px 45px;
        border-radius: 28px;
        width: 100%;
        max-width: 480px;
        box-shadow: 0 15px 50px rgba(30, 80, 40, 0.08);
        text-align: center;
      }

      .logo-brand {
        font-size: 24px;
        font-weight: 700;
        color: #2fa84f;
        margin-bottom: 25px;
        display: inline-block;
      }

      .form-control {
        border-radius: 12px;
        height: 48px;
        border: 1px solid #e0e6e2;
        background-color: #fcfdfc;
        font-size: 14px;
      }

      .form-control:focus {
        border-color: #2fa84f;
        box-shadow: 0 0 0 0.25rem rgba(47, 168, 79, 0.1);
        background-color: #fff;
      }

      .btn-register {
        background-color: #2fa84f;
        color: white;
        border: none;
        border-radius: 12px;
        padding: 14px;
        font-weight: 700;
        font-size: 16px;
        transition: all 0.3s ease;
        margin-top: 10px;
      }

      .btn-register:hover {
        background-color: #268c41;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(47, 168, 79, 0.25);
      }

      .login-link {
        margin-top: 25px;
        font-size: 14px;
        color: #6b7c71;
      }

      .login-link a {
        color: #2fa84f;
        text-decoration: none;
        font-weight: 700;
      }

      label {
        font-size: 11px;
        font-weight: 700;
        color: #6b7c71;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 5px;
        display: block;
        text-align: left;
        margin-left: 5px;
      }
    </style>
  </head>

  <body>
    <a href="login.html" class="btn-back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Kembali
    </a>

    <div class="register-card">
      <div class="logo-brand">🌿 GreenMarket</div>

      <h1 style="font-size: 24px; font-weight: 700; color: #1a2e1f; margin-bottom: 8px">
        Buat Akun Baru
      </h1>
      <p style="font-size: 14px; color: #6b7c71; margin-bottom: 30px">
        Mari mulai langkah kecil untuk bumi yang lebih baik.
      </p>

      <form id ="registerForm">
        <div class="mb-3">
          <label>username</label>
          <input id="username" name="username" type="text" class="form-control" placeholder="Masukkan Username" required />
        </div>

        <div class="mb-3">
          <label>Email</label>
          <input id="email" name="email" type="email" class="form-control" placeholder="nama@email.com" required />
        </div>

        <div class="mb-4">
          <label>Kata Sandi</label>
          <input id="password" name="password" type="password" class="form-control" placeholder="Minimal 8 karakter" required />
        </div>

        <div class="d-flex gap-2 align-items-start mb-4" style="text-align: left;">
          <input id="terms" name="terms" type="checkbox" style="width: 18px; height: 18px; accent-color: #2fa84f; margin-top: 2px;" required />
          <p style="font-size: 12px; color: #6b7c71; margin: 0; line-height: 1.5;">
            Saya setuju dengan <span style="color: #2fa84f; font-weight: 600;">Syarat & Ketentuan</span> yang berlaku di GreenMarket.
          </p>
        </div>

        <button type="submit" class="btn-register w-100">
          Daftar Sekarang
        </button>
      </form>

      <p class="login-link">
        Sudah punya akun? <a href="login.html">Masuk di sini</a>
      </p>
    </div>

    <script type="module" src="../api-fetch/register.js"></script>
  </body>
</html>
