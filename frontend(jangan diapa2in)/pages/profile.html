<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenMarket - Profil Saya</title>
    
    <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>

    <nav id="navbar" class="navbar navbar-expand-lg fixed-top px-4">
      <div class="container-fluid">
        <a href="LandingPage.html" class="navbar-brand">GreenMarket</a>
        <div class="ms-auto d-flex align-items-center">
            <a href="wishlist.html" class="text-muted me-4"><i class="bi bi-cart3 fs-5"></i></a>
            <div class="fw-bold small text-muted">Halo, Muhammad!</div>
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="row">
        
        <div class="col-lg-3">
          <div class="profile-sidebar">
            <div class="text-center mb-4">
                <div class="avatar-wrapper mx-auto">
                    <img src="https://ui-avatars.com/api/?name=Muhammad+Ardian&background=2fa84f&color=fff" class="avatar-img" />
                    <button class="btn-edit-avatar"><i class="bi bi-camera-fill"></i></button>
                </div>
                <h6 class="fw-bold mb-0">Muhammad Ardian</h6>
                <small class="text-muted">Member Sejak 2026</small>
            </div>
            
            <hr class="my-4 text-muted opacity-25">

            <nav>
                <a href="#" class="profile-nav-link active">
                    <i class="bi bi-person"></i> Profil Saya
                </a>
                <a href="#" class="profile-nav-link">
                    <i class="bi bi-geo-alt"></i> Alamat
                </a>
                <a href="#" class="profile-nav-link">
                    <i class="bi bi-bag-check"></i> Pesanan Saya
                </a>
                <a href="#" class="profile-nav-link text-danger">
                    <i class="bi bi-box-arrow-right"></i> Keluar
                </a>
            </nav>
          </div>
        </div>

        <div class="col-lg-9">
          <div class="card-profile">
            <h3 class="fw-bold mb-4">Pengaturan Profil</h3>
            
            <form>
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label">Nama Lengkap</label>
                        <input type="text" class="form-control-gm w-100" value="Muhammad Ardian Maulana">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control-gm w-100" value="ardian_maulana">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control-gm w-100" value="ardian@example.com">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nomor Telepon</label>
                        <input type="text" class="form-control-gm w-100" value="08123456789">
                    </div>
                </div>

                <div class="mt-5 pt-3 border-top">
                    <button type="submit" class="btn-save">Simpan Perubahan</button>
                </div>
            </form>
          </div>
        </div>

      </div>
    </div>

</body>
</html>
