<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Produk - GreenMarket</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f8e9;
            color: #1a2e1f;
            margin: 0;
            padding: 0;
        }

        /* NAVBAR */
        #navbar {
            background-color: white;
            box-shadow: 0 4px 25px rgba(30, 80, 40, 0.05);
            border-bottom: 1px solid #e0e6e2;
            padding: 15px 0;
        }

        .navbar-brand {
            color: #2fa84f !important;
            font-size: 24px;
            font-weight: 800;
            text-decoration: none;
        }

        /* CONTAINER UTAMA */
        /* Margin top 120px untuk memberi ruang di bawah navbar yang fixed */
        .container-main {
            margin-top: 120px;
            margin-bottom: 60px;
            display: flex;
            justify-content: center;
            padding: 0 15px;
        }

        /* KOTAK CARD */
        .card-border {
            width: 100%;
            max-width: 850px; /* Mengecilkan lebar card agar tidak memenuhi layar */
            border-radius: 24px !important;
            border: none;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            background-color: #fff;
        }

        /* HEADER CARD */
        .card-header-custom {
            background-color: #e2f3d5;
            padding: 2rem;
            border: none;
        }

        .card-header-custom h2 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .header-subtitle {
            font-size: 0.95rem;
            color: #4a5a4d;
            margin: 0;
        }

        /* BODY CARD */
        .card-body-custom {
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .label-container {
            width: 100%;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .label-text {
            font-weight: 700;
        }

        .label-count {
            color: #88968a;
            margin-left: 5px;
        }

        /* AREA UPLOAD */
        .upload-area {
            border: 2px dashed #d1d9d2;
            border-radius: 20px;
            padding: 50px 20px;
            width: 100%;
            margin-bottom: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            background-color: #fafdfb;
            cursor: pointer;
        }

        .upload-area:hover {
            background-color: #f1f8e9;
            border-color: #2fa84f;
        }

        .icon-plus {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #e8ede9;
            margin: 0 auto 1rem auto;
            color: #6c757d;
        }

        .instruction-title {
            font-weight: 700;
            margin-bottom: 4px;
        }

        .instruction-subtitle {
            font-size: 0.85rem;
            color: #6b7c71;
            margin-bottom: 4px;
        }

        .instruction-format {
            font-size: 0.75rem;
            color: #a0afa3;
        }

        /* TIPS BOX */
        .tips-box {
            background-color: #f0f9f1;
            border-radius: 12px;
            width: 100%;
            margin-bottom: 2rem;
            padding: 12px 18px;
        }

        .tips-text {
            color: #2fa84f;
            font-size: 0.85rem;
            margin: 0;
            font-weight: 500;
        }

        /* TOMBOL KIRIM */
        .btn-kirim {
            background-color: #2fa84f;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            width: 60%; /* Tombol tidak terlalu lebar */
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(47, 168, 79, 0.2);
        }

        .btn-kirim:hover {
            background-color: #268c41;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(47, 168, 79, 0.3);
        }

        /* HIDE INPUT */
        #fileInput {
            display: none;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .btn-kirim {
                width: 100%;
            }
            .container-main {
                margin-top: 100px;
            }
        }
    </style>
</head>
<body>

    <nav id="navbar" class="navbar navbar-expand-lg fixed-top px-4">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">GreenMarket</a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <i class="bi bi-search" style="font-size: 20px; cursor: pointer;"></i>
                <i class="bi bi-bell" style="font-size: 20px; cursor: pointer;"></i>
                <i class="bi bi-person-circle" style="font-size: 24px; cursor: pointer;"></i>
            </div>
        </div>
    </nav>

    <div class="container-main">
        <div class="card-border">
            <div class="card-header-custom">
                <h2>Upload produk jualan mu</h2>
                <p class="header-subtitle">Mulai jual produk Anda dan raih keuntungan maksimal</p>
            </div>

            <div class="card-body-custom">
                <div class="label-container">
                    <span class="label-text">Foto Produk</span>
                    <span class="label-count">(0/5)</span>
                </div>

                <div class="upload-area" onclick="document.getElementById('fileInput').click();">
                    <div class="icon-plus">
                        <i class="bi bi-plus-lg" style="font-size: 24px;"></i>
                    </div>
                    <p class="instruction-title">Drag & drop gambar di sini</p>
                    <p class="instruction-subtitle">atau klik memilih file</p>
                    <p class="instruction-format">PNG, JPG hingga 10MB</p>
                    <input type="file" id="fileInput" multiple accept="image/*">
                </div>

                <div class="tips-box">
                    <p class="tips-text">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        Tips: Foto pertama akan menjadi foto utama produk. Gunakan foto dengan kualitas terbaik!
                    </p>
                </div>

                <button type="button" class="btn-kirim">Kirim</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
