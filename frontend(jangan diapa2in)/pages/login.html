<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - GreenMarket</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.css" />

    <link rel="stylesheet" href="../css/Login.css" />
  </head>

  <body>
    <a href="LandingPage.html" class="btn-back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Kembali
    </a>

    <div class="login-card">
      <div class="logo-brand">🌿 GreenMarket</div>

      <h1 style="font-size: 26px; font-weight: 700; color: #1a2e1f; margin-bottom: 8px">
        Selamat Datang
      </h1>
      <p style="font-size: 15px; color: #6b7c71; margin-bottom: 35px">
        Masuk untuk melanjutkan aksi hijau Anda.
      </p>

      <form id="loginForm">
        <div class="text-start mb-3">
          <label style="font-size: 12px; font-weight: 700; color: #6b7c71; margin-left: 5px; text-transform: uppercase;">Email</label>
         <input id="email" name="email" type="email" class="form-control" placeholder="nama@email.com" required />
        </div>

        <div class="text-start mb-4">
          <div class="d-flex justify-content-between">
            <label style="font-size: 12px; font-weight: 700; color: #6b7c71; margin-left: 5px; text-transform: uppercase;">Kata Sandi</label>
            <a href="#" style="font-size: 12px; color: #2fa84f; text-decoration: none; font-weight: 600;">Lupa?</a>
          </div>
          <input id="password" name="password" type="password" class="form-control" placeholder="••••••••" style="margin-top: 5px;" required />
        </div>

        <button type="submit" class="btn-login w-100">
          Masuk Sekarang
        </button>
      </form>

      <p class="register-link">
        Belum punya akun? <a href="register.html">Daftar Gratis</a>
      </p>
    </div>

    <script type="module" src="../api-fetch/login.js"></script>
  </body>
</html>
